name: mobile
description: "BNA Assurance Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # API backend
  http: ^1.6.0

  # PDF (génération du contrat côté mobile)
  pdf: ^3.11.1

  # Fichiers / ouverture
  path_provider: ^2.1.5
  open_file: ^3.5.11

  # Divers
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/bna-logo.png
    - assets/images/bg.jpg