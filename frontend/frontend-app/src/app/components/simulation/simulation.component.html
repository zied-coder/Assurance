<div class="sim-box">

  <h3>Simulation Devis</h3>

  <input type="number" [(ngModel)]="data.age" placeholder="Age">

  <input type="number" [(ngModel)]="data.valeur" placeholder="Valeur du bien">

  <select [(ngModel)]="data.typeAssurance" (change)="updateFormules()">
    <option value="">Type assurance</option>
    <option value="AUTO">🚗 AUTO</option>
    <option value="HABITATION">🏠 HABITATION</option>
    <option value="SANTE">🏥 SANTE</option>
    <option value="VIE">❤️ VIE</option>
  </select>

  <div *ngIf="data.typeAssurance === 'AUTO'" class="auto-fields" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px;">
    <input type="number" [(ngModel)]="data.ageVehicule" placeholder="Âge du véhicule (années)">
    <input type="number" [(ngModel)]="data.puissanceMoteur" placeholder="Puissance moteur (CV)">
  </div>

  <select [(ngModel)]="data.formule">
    <option value="">Formule</option>
    <option *ngFor="let f of formulesDisponibles" [value]="f">
      {{f}}
    </option>
  </select>

  <button (click)="simuler()">Simuler</button>

  <div *ngIf="result" class="result-box">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h3 style="margin: 0;">💰 Prime: {{result.prix}} DT</h3>
      <span *ngIf="result.riskLevel" 
            style="padding: 5px 10px; border-radius: 5px; color: white; font-weight: bold;"
            [ngStyle]="{'background-color': result.riskLevel === 'FAIBLE' ? '#28a745' : (result.riskLevel === 'MODÉRÉ' ? '#ffc107' : '#dc3545')}">
        Risque: {{ result.riskLevel }}
      </span>
    </div>
    <h3 *ngIf="result.couverture > 0">🛡️ Plafond Max. Estimé: {{result.couverture}} DT</h3>
    
    <div *ngIf="result.detailsGaranties?.length > 0" class="mt-3">
      <h5>Garanties Incluses:</h5>
      <ul style="list-style-type: none; padding-left: 0;">
        <li *ngFor="let g of result.detailsGaranties" style="margin-bottom: 5px;">{{ g }}</li>
      </ul>
    </div>
    
    <p class="mt-2 text-muted" style="font-size: 0.9em;">{{result.message}}</p>
  </div>

</div>
