<div class="login-card">
  <div class="brand-section">
    <img src="assets/images/bna-logo.png" alt="Assurances" class="logo-login" style="object-fit:contain; border-radius:8px; background:white; padding:4px;">
    <h1 class="login-title">{{ 'login.title_manager' | translate }}</h1>
    <p class="login-subtitle">{{ 'login.connect_subtitle' | translate }}</p>
  </div>

  <form (ngSubmit)="login()" #loginForm="ngForm">
    <div class="form-group-custom">
      <label class="form-label-custom">{{ 'login.identifier' | translate }}</label>
      <div class="position-relative">
        <input type="text" class="input-modern" required 
               [(ngModel)]="username" name="username"
               [placeholder]="'signup.username' | translate">
      </div>
    </div>

    <div class="form-group-custom">
      <label class="form-label-custom">{{ 'login.password' | translate }}</label>
      <div class="position-relative">
        <input type="password" class="input-modern" required 
               [(ngModel)]="password" name="password"
               placeholder="••••••••">
      </div>
    </div>

    <button type="submit" class="btn-login-manager">
      <i class="bi bi-shield-lock-fill me-2"></i>{{ 'login.connect' | translate }}
    </button>

    <div *ngIf="errorMessage" class="error-modern animate-fade-in">
      <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ errorMessage }}
    </div>
  </form>

  <div class="signup-hint">
    <p>{{ 'login.not_client' | translate }} <a routerLink="/signup/manager" class="signup-link">{{ 'login.create_account' | translate }}</a></p>
  </div>

  <div class="text-center mt-3">
    <a routerLink="/" class="text-muted small text-decoration-none" style="font-size:0.82rem;">
      <i class="bi bi-house-door me-1"></i> {{ 'common.back_to_home' | translate }}
    </a>
  </div>
</div>
